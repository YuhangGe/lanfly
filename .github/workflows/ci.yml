name: build and release

# Manual only. A run verifies the workspace, builds and publishes every
# platform package first, then builds and publishes the root lanfly package.
# Configure npm trusted publishing for lanfly and both lanfly-input-* packages.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: check runtime and WebUI
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and type-check
        run: pnpm lint
      - name: Build runtime and web assets
        run: pnpm build

  native:
    name: build and publish ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      HUSKY: 0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --locked --release --target ${{ matrix.target }}
      - name: Prepare platform package
        shell: bash
        run: |
          cp native/target/${{ matrix.target }}/release/liblanfly_input.dylib \
             platform/${{ matrix.platform }}/index.node
          cp LICENSE platform/${{ matrix.platform }}/LICENSE
      - name: Smoke-test Node loading
        run: node -e 'const n=require("./platform/${{ matrix.platform }}"); JSON.parse(n.status()); n.stop()'
      - name: Publish platform package
        working-directory: platform/${{ matrix.platform }}
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already in registry — skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

  publish:
    name: publish lanfly
    needs: [verify, native]
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - name: Install build dependencies
        # bun ships a native binary via postinstall; do not skip install scripts here.
        run: pnpm install --frozen-lockfile
      - name: Build runtime and web assets
        run: pnpm build
      - name: Publish root package
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already in registry — skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi
