[package]
name = "lanfly-input"
version = "0.3.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neon = { version = "1.1.2", features = ["napi-6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = { version = "0.21.1", default-features = false, features = [
  "runtime-tokio",
  "crypto-ring",
] }
rtc = "0.21.1"
rtc-interceptor = "0.21.1"
sansio = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
bytes = "1"
crossbeam-channel = "0.5"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[build-dependencies]
cc = "1"
